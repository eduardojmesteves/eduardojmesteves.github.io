description: With a PhD in Biomedicine and experience spanning academic research, industry, and European research infrastructures, I bring a dual focus on *programme management* and *bioinformatics*. I have coordinated multi-partner projects, delivered reporting and governance frameworks, and built reproducible pipelines in proteomics and NGS. My work bridges policy and practice—turning complex life-science data into clear, actionable outcomes for research institutes and companies alike.
