<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>

    <!-- Minimal theme stylesheet (served by the theme gem) -->
    <link rel="stylesheet"
          href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.github.build_revision }}">

    <!-- Your extra CSS (you already have assets/css/links.css) -->
    <link rel="stylesheet" href="{{ '/assets/css/links.css' | relative_url }}">

    {% include gtm-head.html %}
  </head>
  <body>
    {% include gtm-body.html %}

    <div class="container">
      {{ content }}
    </div>
  </body>
</html>
